<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <title>Paywall / успешная покупка</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4FF" />
      <stop offset="0.42" stop-color="#FDFBFF" />
      <stop offset="1" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="wash" cx="0.5" cy="0" r="0.62">
      <stop offset="0" stop-color="#EFE7FF" stop-opacity="0.95" />
      <stop offset="1" stop-color="#EFE7FF" stop-opacity="0" />
    </radialGradient>
    <!-- the implementation scrolls its body under a fixed CTA bar; clip the
         mock the same way so content cannot bleed over the button -->
    <clipPath id="scrollArea">
      <rect x="0" y="0" width="390" height="689" />
    </clipPath>
  </defs>
  <rect x="0" y="0" width="390" height="844" fill="url(#bg)" />
  <rect x="0" y="0" width="390" height="360" fill="url(#wash)" />
  <g clip-path="url(#scrollArea)">
  <!-- status bar -->
  <text x="28" y="32" font-family="Roboto" font-size="14" font-weight="700" fill="#1E1A2E">9:41</text>
  <rect x="294" y="22" width="52" height="14" rx="4" fill="#1E1A2E" opacity="0.85" />
  <!-- top bar -->
  <circle cx="38" cy="68" r="17" fill="#FFFFFF" opacity="0.72" />
  <path d="M32 62 l12 12 M44 62 l-12 12" stroke="#4A4560" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <text x="195" y="73" font-family="Roboto" font-size="13.5" font-weight="800" fill="#4A4560" text-anchor="middle">🏝️ Чудо-Остров</text>
