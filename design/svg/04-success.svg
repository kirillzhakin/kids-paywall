  <circle cx="195" cy="166" r="62" fill="#E4F9EF" opacity="0.7" />
  <circle cx="195" cy="166" r="38" fill="#14C07B" />
  <path d="M 183.44 167.7 L 191.6 175.86 L 206.9 155.8" fill="none" stroke="#FFFFFF" stroke-width="5.67" stroke-linecap="round" stroke-linejoin="round" />
  <text x="195" y="254" font-family="Roboto" font-size="24" font-weight="900" fill="#1E1A2E" text-anchor="middle">Полный доступ открыт!</text>
  <text x="195" y="282" font-family="Roboto" font-size="13.5" font-weight="600" fill="#4A4560" text-anchor="middle">Все 120 уровней и шесть островов</text>
  <text x="195" y="301" font-family="Roboto" font-size="13.5" font-weight="600" fill="#4A4560" text-anchor="middle">разблокированы. Приятной игры!</text>
  <rect x="20" y="320" width="350" height="52" rx="26" fill="#6A45FF" />
  <text x="195" y="352" font-family="Roboto" font-size="15.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">Продолжить игру</text>
  <rect x="20" y="388" width="350" height="120" rx="16" fill="#F6F3FF" stroke="#E9E5F5" stroke-width="1" />
  <text x="34" y="414" font-family="Roboto" font-size="11.5" font-weight="700" fill="#8B86A3">Тариф</text>
  <text x="356" y="414" font-family="Roboto" font-size="12.5" font-weight="800" fill="#1E1A2E" text-anchor="end">Полный доступ · раз в год</text>
  <text x="34" y="438" font-family="Roboto" font-size="11.5" font-weight="700" fill="#8B86A3">Сумма</text>
  <text x="356" y="438" font-family="Roboto" font-size="12.5" font-weight="800" fill="#1E1A2E" text-anchor="end">1 790 ₽</text>
  <text x="34" y="462" font-family="Roboto" font-size="11.5" font-weight="700" fill="#8B86A3">Дата</text>
  <text x="356" y="462" font-family="Roboto" font-size="12.5" font-weight="800" fill="#1E1A2E" text-anchor="end">14 октября в 19:04</text>
  <text x="34" y="486" font-family="Roboto" font-size="11.5" font-weight="700" fill="#8B86A3">Номер покупки</text>
  <text x="356" y="486" font-family="Roboto" font-size="12.5" font-weight="800" fill="#1E1A2E" text-anchor="end">pur_mv8a1xj6m5pa8y</text>
  <rect x="60" y="520" width="270" height="28" rx="14" fill="#E4F9EF" />
  <text x="195" y="539" font-family="Roboto" font-size="11.5" font-weight="800" fill="#0B8F5B" text-anchor="middle">🎮  Доступ привязан к этому устройству</text>
  </g>

</svg>
