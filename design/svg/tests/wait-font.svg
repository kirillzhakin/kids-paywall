<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <title>Paywall / 390x844 — основной</title>
  <defs>
    <style>
      @font-face { font-family: 'Roboto'; font-display: block; src: local('Roboto'); }
