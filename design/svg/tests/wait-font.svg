  <text x="195" y="777" font-family="Roboto" font-size="15" font-weight="700" fill="#8B86A3" text-anchor="middle">•</text>
  <text x="279" y="778" font-family="Roboto" font-size="12.5" font-weight="700" fill="#4A27D6" text-anchor="middle">Мои покупки</text>
  <text x="195" y="801" font-family="Roboto" font-size="10" font-weight="600" fill="#8B86A3" text-anchor="middle">Тестовая покупка без списания денег.</text>
  <text x="195" y="815" font-family="Roboto" font-size="10" font-weight="600" fill="#8B86A3" text-anchor="middle">Подписку можно отменить в настройках.</text>
